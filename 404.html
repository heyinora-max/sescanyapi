<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — Ses Can Yapı</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="https://heyinora-max.github.io/sescanyapi/assets/icon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:'Inter',sans-serif;background:#16181D;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box h1{font-family:'Sora',sans-serif;font-size:clamp(64px,14vw,120px);line-height:1;color:#F15A22;letter-spacing:-.03em}
  .box h2{font-family:'Sora',sans-serif;font-size:clamp(20px,3vw,28px);margin-top:12px}
  .box p{color:#9AA1AC;margin-top:12px;font-size:16px}
  .box a{display:inline-flex;margin-top:28px;padding:15px 30px;border-radius:6px;background:#F15A22;color:#fff;text-decoration:none;font-weight:700;transition:background .2s}
  .box a:hover{background:#D2481A}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Aradığınız sayfa bulunamadı</h2>
    <p>Sayfa taşınmış ya da kaldırılmış olabilir. Anasayfadan devam edebilirsiniz.</p>
    <a href="https://heyinora-max.github.io/sescanyapi/">Anasayfaya Dön</a>
  </div>
</body>
</html>
